services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  bot:
    build: ./bot
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - botstate:/app/state
    restart: always

  # No trading service is defined on purpose. Strategies were removed on
  # 2026-10-04 (see git tag archive/legacy-strategies-2026-10-04); a new
  # trader is added here only after it passes backtest → paper → demo gates.

  dashboard:
    build: ./dashboard
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - bot
    environment:
      NEXT_PUBLIC_API_URL: http://bot:8000
      API_URL: http://bot:8000
    restart: always

volumes:
  pgdata:
  botstate:

networks:
  default:
