services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  bot:
    build: ./bot
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - botstate:/app/state
    restart: always

  # OKX DEMO trader (refuses OKX_MODE != demo). Evidence and limits:
  # docs/research/donchian-majors-v3/v4-result-2026-10-09.md. Spot, no leverage,
  # 4 sleeves × $1,000, ATR-sized entries, once per confirmed UTC daily bar.
  donchian-trader:
    build: ./bot
    command: python -m scripts.run_donchian_trader --capital-usd 4000 --risk-pct 5
    depends_on:
      postgres:
        condition: service_healthy
      bot:
        condition: service_started
    env_file: .env
    volumes:
      - botstate:/app/state
    restart: always

  dashboard:
    build: ./dashboard
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - bot
    environment:
      NEXT_PUBLIC_API_URL: http://bot:8000
      API_URL: http://bot:8000
    restart: always

volumes:
  pgdata:
  botstate:

networks:
  default:
