[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okx-trading-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]
ml = [
    "pandas[pyarrow]>=2.2.0",
    "chronos-forecasting>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "strategies"]
